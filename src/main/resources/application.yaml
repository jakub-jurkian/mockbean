spring:
  application:
    name: mockbean
  datasource:
    url: jdbc:postgresql://localhost:5432/mockbean_db
    username: mockbean_user
    password: mockbean_password
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
mockbean:
  # Overridden by each model profile, so stored evaluations record which judge produced them
  judge-model: llama3.1
  # Minimum pgvector relevance, (1 + cosine) / 2, for a retrieved reference. Measured on the test
  # set: every on-topic question scored >= 0.83, off-topic questions <= 0.76.
  rag-min-score: 0.80

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

langchain4j:
  ollama:
    chat-model:
      base-url: http://localhost:11434
      model-name: llama3.1
      temperature: 0.0
      format: json
    embedding-model:
      base-url: http://localhost:11434
      model-name: nomic-embed-text
  pgvector:
    host: localhost
    port: 5432
    database: mockbean_db
    user: mockbean_user
    password: mockbean_password
    table: embeddings
    dimension: 768